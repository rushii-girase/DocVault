spring.application.name=institutional-platform
server.port=${PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/institutional_db?createDatabaseIfNotExist=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Rushi@09}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret Properties
app.jwtSecret=${APP_JWT_SECRET:SuperSecretKeyForInstitutionalPlatformWhichShouldBeLongEnoughToSurviveSecurityAudits1234}
app.jwtExpirationMs=86400000

# Mail Configuration (Example for Mailtrap or Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_gmail_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL
app.frontendUrl=${APP_FRONTEND_URL:http://localhost:4200}

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:your-bucket-name}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}


